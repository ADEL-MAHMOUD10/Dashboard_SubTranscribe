<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SubTranscribe</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="/static/image/subtitle.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    
    <script nonce="{{ g.nonce }}">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0b0f19] text-white font-sans antialiased min-h-screen flex items-center justify-center p-4 selection:bg-purple-500/30 selection:text-purple-200">

    <!-- Background Image & Atmospheric Overlay Matching "/" -->
    <div class="bg-intro-cover"></div>
    <div class="bg-intro-overlay"></div>

    <!-- Flash message -->
    {% include 'Flash-message.html' %}

    <div class="w-full max-w-md relative z-10 my-8" data-aos="fade-up">
        
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3 mb-4 group">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-2 shadow-lg group-hover:scale-110 transition-transform duration-300">
                    <img src="/static/image/subtitle.ico" alt="SubTranscribe" class="w-full h-full object-contain">
                </div>
                <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-300 to-purple-300">SubTranscribe</span>
            </a>
            <h1 class="text-2xl font-extrabold text-white">Create Account</h1>
            <p class="text-xs text-white/70 mt-1">Start transcribing and generating subtitles in seconds</p>
        </div>

        <!-- Glass Card -->
        <div class="glass-card p-8 shadow-2xl">
            <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <!-- Username -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-white/80 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                            <i class="ti ti-user text-base"></i>
                        </div>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="johndoe" 
                            required
                            class="form-input block w-full pl-11 pr-4 text-sm"
                        >
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-white/80 uppercase tracking-wider mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                            <i class="ti ti-mail text-base"></i>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="name@example.com" 
                            required
                            class="form-input block w-full pl-11 pr-4 text-sm"
                        >
                    </div>
                </div>
                
                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-white/80 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                            <i class="ti ti-lock text-base"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                            class="form-input block w-full pl-11 pr-11 text-sm"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/50 hover:text-white transition-colors"
                        >
                            <i class="ti ti-eye text-base"></i>
                        </button>
                    </div>

                    <!-- Password Strength Bar -->
                    <div class="mt-2.5">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[11px] text-white/60">Strength</span>
                            <span id="passwordStrengthText" class="text-[11px] text-white/60 font-semibold">Too weak</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden border border-white/10">
                            <div id="passwordStrengthBar" class="h-full rounded-full bg-red-500 transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="c_password" class="block text-xs font-semibold text-white/80 uppercase tracking-wider mb-2">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                            <i class="ti ti-lock text-base"></i>
                        </div>
                        <input 
                            type="password" 
                            id="c_password" 
                            name="c_password" 
                            placeholder="••••••••" 
                            required
                            class="form-input block w-full pl-11 pr-11 text-sm"
                        >
                        <button 
                            type="button" 
                            id="toggleConfirmPassword" 
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/50 hover:text-white transition-colors"
                        >
                            <i class="ti ti-eye text-base"></i>
                        </button>
                    </div>
                </div>
                
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="btn-glow-primary w-full py-3.5 px-4 text-sm font-bold flex items-center justify-center gap-2 mt-6 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <span>Create Account</span>
                    <i class="ti ti-arrow-right text-base"></i>
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <p class="text-xs text-white/70">
                    Already have an account? 
                    <a href="{{ url_for('auth.login') }}" class="text-blue-400 hover:text-blue-300 font-bold ml-1">
                        Sign In
                    </a>
                </p>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-white/60 hover:text-white transition-colors inline-flex items-center gap-1.5 font-medium">
                <i class="ti ti-arrow-left text-xs"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </div>

    <script nonce="{{ g.nonce }}">
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            const confirmPasswordInput = document.getElementById('c_password');
            const submitBtn = document.getElementById('submitBtn');
            const passwordStrengthBar = document.getElementById('passwordStrengthBar');
            const passwordStrengthText = document.getElementById('passwordStrengthText');

            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function(e) {
                    e.preventDefault();
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    togglePassword.innerHTML = type === 'password' 
                        ? '<i class="ti ti-eye text-base"></i>' 
                        : '<i class="ti ti-eye-off text-base"></i>';
                });
            }

            if (toggleConfirmPassword && confirmPasswordInput) {
                toggleConfirmPassword.addEventListener('click', function(e) {
                    e.preventDefault();
                    const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    confirmPasswordInput.setAttribute('type', type);
                    toggleConfirmPassword.innerHTML = type === 'password' 
                        ? '<i class="ti ti-eye text-base"></i>' 
                        : '<i class="ti ti-eye-off text-base"></i>';
                });
            }

            function validatePassword() {
                const pass = passwordInput.value;
                const cPass = confirmPasswordInput.value;
                let strength = 0;

                if (pass.length >= 8) strength += 25;
                if (/[A-Z]/.test(pass)) strength += 25;
                if (/[0-9]/.test(pass)) strength += 25;
                if (/[^A-Za-z0-9]/.test(pass)) strength += 25;

                passwordStrengthBar.style.width = strength + '%';

                if (strength < 50) {
                    passwordStrengthBar.className = 'h-full rounded-full bg-red-500';
                    passwordStrengthText.textContent = 'Weak';
                    passwordStrengthText.className = 'text-[11px] text-red-400 font-semibold';
                } else if (strength < 100) {
                    passwordStrengthBar.className = 'h-full rounded-full bg-amber-500';
                    passwordStrengthText.textContent = 'Medium';
                    passwordStrengthText.className = 'text-[11px] text-amber-400 font-semibold';
                } else {
                    passwordStrengthBar.className = 'h-full rounded-full bg-emerald-500';
                    passwordStrengthText.textContent = 'Strong';
                    passwordStrengthText.className = 'text-[11px] text-emerald-400 font-semibold';
                }

                if (pass.length >= 6 && pass === cPass) {
                    submitBtn.disabled = false;
                } else {
                    submitBtn.disabled = true;
                }
            }

            passwordInput.addEventListener('input', validatePassword);
            confirmPasswordInput.addEventListener('input', validatePassword);
            submitBtn.disabled = true;
        });
    </script>
</body>
</html>
