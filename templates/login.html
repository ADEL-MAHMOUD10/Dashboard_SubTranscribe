<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - SubTranscribe</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="/static/image/subtitle.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/common.css">
    
    <script nonce="{{ g.nonce }}">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0b0f19] text-white font-sans antialiased min-h-screen flex items-center justify-center p-4 selection:bg-purple-500/30 selection:text-purple-200">

    <!-- Background Image & Atmospheric Overlay Matching "/" -->
    <div class="bg-intro-cover"></div>
    <div class="bg-intro-overlay"></div>

    <!-- Flash message -->
    {% include 'Flash-message.html' %}

    <div class="w-full max-w-md relative z-10 my-8" data-aos="fade-up">
        
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-3 mb-4 group">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center p-2 shadow-lg group-hover:scale-110 transition-transform duration-300">
                    <img src="/static/image/subtitle.ico" alt="SubTranscribe" class="w-full h-full object-contain">
                </div>
                <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-300 to-purple-300">SubTranscribe</span>
            </a>
            <h1 class="text-2xl font-extrabold text-white">Welcome Back</h1>
            <p class="text-xs text-white/70 mt-1">Sign in to your account and continue transcribing</p>
        </div>

        <!-- Glass Card -->
        <div class="glass-card p-8 shadow-2xl">
            <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div>
                    <label for="email" class="block text-xs font-semibold text-white/80 uppercase tracking-wider mb-2">Email or Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                            <i class="ti ti-mail text-base"></i>
                        </div>
                        <input 
                            type="text" 
                            id="email" 
                            name="email" 
                            placeholder="name@example.com" 
                            required
                            class="form-input block w-full pl-11 pr-4 text-sm"
                        >
                    </div>
                </div>
                
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-xs font-semibold text-white/80 uppercase tracking-wider">Password</label>
                        <a href="{{ url_for('reset_pass.check_user') }}" class="text-xs text-blue-400 hover:text-blue-300 transition-colors font-medium">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/40">
                            <i class="ti ti-lock text-base"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                            class="form-input block w-full pl-11 pr-11 text-sm"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/50 hover:text-white transition-colors"
                        >
                            <i class="ti ti-eye text-base"></i>
                        </button>
                    </div>
                </div>
                
                <button 
                    type="submit" 
                    class="btn-glow-primary w-full py-3.5 px-4 text-sm font-bold flex items-center justify-center gap-2 mt-6"
                >
                    <span>Sign In</span>
                    <i class="ti ti-arrow-right text-base"></i>
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-white/10 text-center">
                <p class="text-xs text-white/70">
                    Don't have an account? 
                    <a href="{{ url_for('auth.register') }}" class="text-blue-400 hover:text-blue-300 font-bold ml-1">
                        Sign Up
                    </a>
                </p>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-white/60 hover:text-white transition-colors inline-flex items-center gap-1.5 font-medium">
                <i class="ti ti-arrow-left text-xs"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </div>

    <script nonce="{{ g.nonce }}">
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function(e) {
                    e.preventDefault();
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    togglePassword.innerHTML = type === 'password' 
                        ? '<i class="ti ti-eye text-base"></i>' 
                        : '<i class="ti ti-eye-off text-base"></i>';
                });
            }
        });
    </script>
</body>
</html>
